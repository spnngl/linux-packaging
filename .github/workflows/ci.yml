# Builds the repository from packages.toml, installs every package on each distribution from the
# built site, and publishes the site from main. A pull request runs the same steps with a key
# generated on the spot, so it never touches the signing key (PLAN.md, decisions 1 and 8).
name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    # Only main may read the signing key: the environment restricts its deployment branches.
    environment: ${{ github.ref == 'refs/heads/main' && 'signing' || 'throwaway' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          # renovate: datasource=github-releases depName=nushell/nushell
          version: "0.116.1"
      - run: sudo apt-get install --yes --no-install-recommends reprepro createrepo-c rpm gnupg
      - if: github.ref == 'refs/heads/main'
        run: nu scripts/build.nu out
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - if: github.ref != 'refs/heads/main'
        run: nu scripts/build.nu out --throwaway
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        image: [debian:testing, ubuntu:26.04, fedora:44, opensuse/tumbleweed]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          # renovate: datasource=github-releases depName=nushell/nushell
          version: "0.116.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out
      # On main the site carries the real key: it must be the committed one.
      - if: github.ref == 'refs/heads/main'
        run: nu scripts/install-test.nu out "$IMAGE" --key-file keys/spnngl.asc
        env:
          IMAGE: ${{ matrix.image }}
      - if: github.ref != 'refs/heads/main'
        run: nu scripts/install-test.nu out "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: install
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and none cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
