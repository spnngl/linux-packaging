# The packages this repository serves, one release of each (PLAN.md, decisions 2 to 4).
# Renovate bumps `tag` (renovate.json5).
#
# name:     the deb and rpm package name
# repo:     GitHub repository whose release holds the .deb and .rpm assets
# tag:      release tag, `v` followed by the package version
# workflow: workflow that attested the assets, relative to the repository

[[package]]
name = "tokenmtr"
repo = "spnngl/tokenmtr"
tag = "v0.4.0"
workflow = ".github/workflows/release.yml"

[[package]]
name = "transmission-exporter"
repo = "spnngl/transmission-exporter"
tag = "v0.5.0"
workflow = ".github/workflows/release.yml"

[[package]]
name = "artifacthub-exporter"
repo = "spnngl/artifacthub-exporter"
tag = "v0.1.0"
workflow = ".github/workflows/release.yml"
